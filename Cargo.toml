[package]
name = "bdh-cq-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A documented Rust/Burn port of lucidrains' public BDH-CQ reconstruction"
keywords = ["machine-learning", "bdh", "latent-reasoning", "linear-attention"]
categories = ["science"]

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff", "vulkan", "fusion", "autotune"] }
rand = { version = "0.10.0", features = ["std", "std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[profile.dev]
# Tensor-heavy debug builds are prohibitively slow with no optimization, while
# level 1 still keeps compilation and debugging pleasant.
opt-level = 1

[profile.release]
lto = "thin"
